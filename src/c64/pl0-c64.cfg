# pl0-c64.cfg -- ld65 config for the PL/0 C64 build (from the Task 1 spike).
# Derived from cc65 2.18's stock c64.cfg (/usr/share/cc65/cfg/c64.cfg).
# Differences:
#   * __HIMEM__ = $A000 (stock: $D000), so code, data, BSS and the C stack
#     all live in $0801-$9FFF and nothing in the program image or the
#     ordinary BSS sits under the BASIC ROM. The C stack (2 KB) occupies
#     $9800-$9FFF, growing down from $A000.
#   * BASICRAM ($A000-$BFFF, RAM under the BASIC ROM) and HIRAM
#     ($C000-$CBFF) are extra BSS-only areas. Use them with
#     `#pragma bss-name (push, "BASICBSS")` / "HIBSS". crt0 does NOT zero
#     them. BASICBSS must never be handed to an fp_* shim (the shims bank
#     BASIC in while the ROM runs); see docs/architecture/spike-results.md.
#   * $CC00-$CFFF is left out: it is the bitmap colour matrix (VIC bank 3).
FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0800; # 2k stack
    __HIMEM__:     type = weak, value = $A000;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $001A;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = __HIMEM__ - __HEADER_LAST__;
    BSS:      file = "",               start = __ONCE_RUN__,    size = __HIMEM__ - __STACKSIZE__ - __ONCE_RUN__;
    BASICRAM: file = "", define = yes, start = $A000,           size = $2000;
    HIRAM:    file = "", define = yes, start = $C000,           size = $0C00;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw;
    ONCE:     load = MAIN,     type = ro,  define   = yes;
    BSS:      load = BSS,      type = bss, define   = yes;
    BASICBSS: load = BASICRAM, type = bss, define   = yes, optional = yes;
    HIBSS:    load = HIRAM,    type = bss, define   = yes, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
